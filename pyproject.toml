[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-gui-plugin-visage"
dynamic = ["version"]
description = "OVOS GUI-1 adapter plugin that relays ovos-gui to the Visage client over a websocket"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Oscillate Labs LLC", email = "mike@oscillatelabs.net" }]
requires-python = ">=3.9"
dependencies = [
    "ovos-plugin-manager",
    "ovos-utils",
    "websockets>=13",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[project.entry-points."opm.gui_adapter"]
ovos-gui-plugin-visage = "ovos_gui_plugin_visage:VisageGUIPlugin"

[tool.setuptools]
packages = ["ovos_gui_plugin_visage"]

[tool.setuptools.dynamic]
version = { attr = "ovos_gui_plugin_visage.version.__version__" }

[tool.pytest.ini_options]
testpaths = ["test"]
